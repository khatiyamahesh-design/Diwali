<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Happy Diwali, Riiii</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Caveat:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2e1512;--head:#5a1522;--gold:#94692a;--soft:#7d6248;--hair:rgba(148,105,42,.5);--em:#8a1f2d;--serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;--sans:'Jost',system-ui,-apple-system,sans-serif;--hand:'Caveat','Segoe Script','Bradley Hand',cursive;--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--serif);min-height:100%;background:radial-gradient(130% 80% at 50% 0%,#fffaf0 0%,#f6e8cb 52%,#ecd6aa 100%) fixed;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden;height:100%}
body:before{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.06;mix-blend-mode:multiply;background-image:var(--noise)}
#spark{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.cap{font-family:var(--sans);font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--soft);font-weight:500}
@keyframes pulse{50%{opacity:.35}}

/* polaroid */
.pol{--r:0deg;position:relative;width:min(74vw,290px);padding:13px 13px 0;background:linear-gradient(180deg,#fffdf8,#f6eedc);border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.1),0 16px 32px rgba(95,50,15,.3),0 3px 8px rgba(95,50,15,.18);opacity:0;transform:translateY(70px) rotate(calc(var(--r) + 9deg)) scale(.94);transition:opacity 1s ease,transform 1.5s cubic-bezier(.2,.9,.3,1.1)}
.pol.in{opacity:1;transform:rotate(var(--r))}
.pol.sway{animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(var(--r))}30%{transform:rotate(calc(var(--r) + .9deg))}70%{transform:rotate(calc(var(--r) - .9deg))}}
.pol:before{content:"";position:absolute;left:50%;top:-11px;width:88px;height:24px;margin-left:-44px;transform:rotate(-3deg);background:rgba(232,205,138,.78);box-shadow:0 1px 3px rgba(0,0,0,.18);clip-path:polygon(0 0,3% 25%,0 50%,3% 75%,0 100%,100% 100%,97% 75%,100% 50%,97% 25%,100% 0);z-index:3}
.ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:#e8dfca;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(2.2) contrast(.45) saturate(0) blur(7px);transform:scale(1.04)}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#f3ecd9,#e9dfc6);opacity:1}
.pol.dev .ph img{filter:none;transform:none;transition:filter 4.4s ease-out .3s,transform 4.4s ease-out .3s}
.pol.dev .ph:after{opacity:0;transition:opacity 3.8s ease-out .2s}
.pol .cp{height:62px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-weight:600;font-size:27px;color:#5d3a2b}

/* intro */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 4vh;cursor:pointer;transition:opacity 1.2s,visibility 1.2s}
#intro.gone{opacity:0;visibility:hidden}
.pile{position:relative;width:min(62vw,250px);height:calc(min(62vw,250px)*1.5);margin:44px 0 52px}
.pile .pol{position:absolute;left:0;top:0;width:100%}
.pile .p1{--r:-10deg;translate:-16px 8px}
.pile .p2{--r:8deg;translate:14px 4px}
.pile .p3{--r:-2deg}
#hint{animation:pulse 2.8s ease-in-out infinite}

/* story */
#story{position:relative;z-index:2;visibility:hidden;opacity:0;transition:opacity 1.4s}
#story.show{visibility:visible;opacity:1}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 70px) 24px calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center}
.rule{display:flex;align-items:center;justify-content:center;gap:14px}
.rule:before,.rule:after{content:"";height:1px;width:38px;background:var(--hair)}
.b{opacity:0;transform:translateY(12px);transition:opacity 1.5s ease,transform 1.5s ease}
.b.v{opacity:1;transform:none}
.t1{margin:24px 0 0;font-weight:500;font-size:clamp(33px,9.6vw,58px);line-height:1.08;color:var(--head);letter-spacing:-.01em}
.t2{margin:4px 0 0;font-style:italic;font-weight:500;font-size:clamp(56px,17vw,92px);line-height:1.05;color:var(--gold)}
.hero{margin-bottom:84px}
.hero .pol{margin:54px auto 0}
.sc{margin:0 0 20px}
.sc .pol{margin:0 auto 52px}
.duo{display:flex;justify-content:center;margin-bottom:52px}
.duo .pol{width:min(44vw,210px);margin:0 -6px;padding:10px 10px 0}
.duo .pol .cp{height:50px;font-size:22px}
.duo .pol:last-child{margin-top:34px}
.txt{max-width:480px;margin:0 auto;font-weight:600;font-size:clamp(22px,5.8vw,27px);line-height:1.68;color:var(--ink)}
.sn{opacity:0;transition:opacity 1.3s ease}
.txt.in .sn{opacity:1}
.k{font-style:italic;font-weight:700;color:var(--em)}
.dv{display:block;width:46px;height:auto;margin:74px auto 64px;overflow:visible}
.dv .fl,.dv .gw{opacity:0;transition:opacity 1.6s}
.dv.in .fl,.dv.in .gw{opacity:1}
.dv.in .fl{animation:flick 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1) rotate(-1.5deg)}to{transform:scale(.94,1.06) rotate(1.5deg)}}
.end{margin-top:30px}
.end1{font-weight:500;font-size:clamp(28px,8vw,40px);line-height:1.25;color:var(--head)}
.end2{margin-top:6px;font-style:italic;font-weight:500;font-size:clamp(46px,14vw,74px);line-height:1.1;color:var(--gold)}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1.6s ease,transform 1.6s ease}
.fade.in{opacity:1;transform:none}
button.top{display:block;margin:56px auto 0;font-family:var(--sans);font-size:11px;letter-spacing:.34em;text-transform:uppercase;font-weight:500;color:var(--head);background:transparent;border:1px solid var(--hair);padding:14px 26px;cursor:pointer}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid var(--hair);background:rgba(255,250,236,.78);display:none;place-items:center;padding:0;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#snd svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#snd .sl{opacity:0}
#snd.muted .sl{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body class="lock">
<canvas id="spark"></canvas>
<audio id="song" src="kesariya.mp3" preload="auto" playsinline></audio>
<button id="snd" aria-label="Toggle music"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="sl" d="M3 3l18 18"/></svg></button>

<div id="intro">
<div class="cap">a little something for you</div>
<div class="pile" id="pile"></div>
<div class="cap" id="hint">touch to begin</div>
</div>

<div id="story"><div class="wrap" id="wrap"></div></div>
